version: "3.9"

# Local development / integration-test stack:
#   - control-plane Postgres: staff auth, brand access, audit log
#   - three tenant Postgres instances: local stand-ins for AmPay / RajaPay /
#     quiet-forest's real databases, seeded with the schema+sample data via
#     scripts/seed_tenant_db.py (never point this compose file at a real
#     brand DB — it's for local dev/testing only)
#   - a Vault dev-mode server, matching the secrets-management principle
#     used by the source monoliths (see app/core/vault.py)
#
# Backend defaults to USE_LOCAL_ENV_SECRETS=true against this stack; set it
# to false and point VAULT_ADDR/VAULT_TOKEN at a real Vault for anything
# beyond local dev.

services:
  control_plane_db:
    image: postgres:16
    environment:
      POSTGRES_DB: admin_panel_control
      POSTGRES_USER: admin_panel
      POSTGRES_PASSWORD: admin_panel
    ports:
      - "5442:5432"
    volumes:
      - control_plane_db_data:/var/lib/postgresql/data

  ampay_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ampay
      POSTGRES_USER: ampay
      POSTGRES_PASSWORD: ampay
    ports:
      - "5443:5432"
    volumes:
      - ampay_db_data:/var/lib/postgresql/data

  rajapay_db:
    image: postgres:16
    environment:
      POSTGRES_DB: rajapay
      POSTGRES_USER: rajapay
      POSTGRES_PASSWORD: rajapay
    ports:
      - "5444:5432"
    volumes:
      - rajapay_db_data:/var/lib/postgresql/data

  quiet_forest_db:
    image: postgres:16
    environment:
      POSTGRES_DB: quiet_forest
      POSTGRES_USER: quiet_forest
      POSTGRES_PASSWORD: quiet_forest
    ports:
      - "5445:5432"
    volumes:
      - quiet_forest_db_data:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  # Local stand-in for each brand's own Redis (method-lookup cache the
  # write paths invalidate — see app.services.cache_invalidation). One
  # container, one logical DB index per brand so invalidation on one brand
  # never touches another's keys.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql+asyncpg://admin_panel:admin_panel@control_plane_db:5432/admin_panel_control
      # Pointed at the user's own real local dev/test Postgres containers
      # (db_test / db_dev_rajapay / db_test_qf, run separately, not part of
      # this compose file) via host.docker.internal — these hold real
      # transaction data from the actual monoliths. DB name is "postgres"
      # in all three. Switch back to the ampay_db/rajapay_db/quiet_forest_db
      # services below (throwaway, seeded via scripts/seed_tenant_db.py) by
      # reverting these six blocks to their *_db hostnames on port 5432.
      BRAND_AMPAY_DB_HOST: host.docker.internal
      BRAND_AMPAY_DB_PORT: 5429
      BRAND_AMPAY_DB_NAME: postgres
      BRAND_AMPAY_DB_USER: postgres
      BRAND_AMPAY_DB_PASSWORD: postgres
      BRAND_RAJAPAY_DB_HOST: host.docker.internal
      BRAND_RAJAPAY_DB_PORT: 5425
      BRAND_RAJAPAY_DB_NAME: postgres
      BRAND_RAJAPAY_DB_USER: postgres
      BRAND_RAJAPAY_DB_PASSWORD: postgres
      BRAND_QUIET_FOREST_DB_HOST: host.docker.internal
      BRAND_QUIET_FOREST_DB_PORT: 5428
      BRAND_QUIET_FOREST_DB_NAME: postgres
      BRAND_QUIET_FOREST_DB_USER: postgres
      BRAND_QUIET_FOREST_DB_PASSWORD: postgres
      # One shared local Redis, one DB index per brand (see the `redis`
      # service above) — real cache invalidation instead of the "no Redis
      # configured" no-op fallback.
      BRAND_AMPAY_REDIS_URL: redis://redis:6379/0
      BRAND_RAJAPAY_REDIS_URL: redis://redis:6379/1
      BRAND_QUIET_FOREST_REDIS_URL: redis://redis:6379/2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - control_plane_db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  control_plane_db_data:
  ampay_db_data:
  rajapay_db_data:
  quiet_forest_db_data:
